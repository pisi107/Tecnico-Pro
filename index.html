                <button onclick="openSection('errori')" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 p-5 rounded-xl text-left transition group">

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentBrand = '';

        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function logout() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
        }

        function selectBrand(brand) {
            currentBrand = brand;
            document.getElementById('brand-title').innerText = brand.toUpperCase();
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-functions').classList.remove('hidden');
        }

        function goToHome() {
            document.getElementById('view-functions').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function openBrandMenu() {
            document.getElementById('view-content').classList.add('hidden');
            document.getElementById('view-functions').classList.remove('hidden');
        }

        function openSection(section) {
            document.getElementById('view-functions').classList.add('hidden');
            document.getElementById('view-content').classList.remove('hidden');

            const titleEl = document.getElementById('section-title');
            const subEl = document.getElementById('section-subtitle');
            const bodyEl = document.getElementById('section-body');

            titleEl.innerText = `${currentBrand} — ${section.toUpperCase()}`;
            subEl.innerText = `Archivio completo suddiviso per unità interna ed esterna`;

            if (section === 'errori') {
                bodyEl.innerHTML = `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <label class="block text-xs uppercase text-slate-400 mb-2">Cerca Codice Errore o Macchina</label>
                        <input type="text" id="search-err" placeholder="Es. U4, E7, A5..." oninput="filterErrors(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div id="error-list" class="space-y-3">
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex justify-between items-start">
                                <span class="bg-red-500/20 text-red-400 text-xs font-bold px-2.5 py-1 rounded">U4</span>
                                <span class="text-xs text-slate-400">Unità Interna / Esterna (Tutti i modelli)</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-200 mt-2">Errore di trasmissione (tra unità interna ed esterna)</h3>
                            <p class="text-xs text-slate-300 mt-1">Possibili cause: Errore di collegamento cavo di interconnessione (morsetti 1, 2, 3), interferenze elettromagnetiche, scheda elettronica danneggiata.</p>
                            <div class="mt-3 pt-3 border-t border-slate-700 flex space-x-2">
                                <button class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded"><i class="fa-solid fa-book mr-1"></i> Apri Manuale</button>
                                <button class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded"><i class="fa-solid fa-pen-ruler mr-1"></i> Schema Elettrico</button>
                            </div>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex justify-between items-start">
                                <span class="bg-red-500/20 text-red-400 text-xs font-bold px-2.5 py-1 rounded">E7</span>
                                <span class="text-xs text-slate-400">Ventilatore Unità Esterna Inverter</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-200 mt-2">Anomalia motore ventilatore esterno o driver</h3>
                            <p class="text-xs text-slate-300 mt-1">Possibili cause: Blocco meccanico ventola, connettore motore staccato sulla scheda inverter esterna, guasto IPM.</p>
                            <div class="mt-3 pt-3 border-t border-slate-700 flex space-x-2">
                                <button class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded"><i class="fa-solid fa-book mr-1"></i> Apri Manuale</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (section === 'ricambi') {
                bodyEl.innerHTML = `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <label class="block text-xs uppercase text-slate-400 mb-2">Seleziona Modello per Esploso</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200">
                            <option>Serie Perfera (FTXM-R / RXM-R)</option>
                            <option>Serie Stylish (FTXA / RXA)</option>
                            <option>Serie Emura (FTXJ / RXJ)</option>
                            <option>Modelli Storici (FTXS / RXS)</option>
                        </select>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center">
                        <i class="fa-solid fa-gears text-4xl text-emerald-400 mb-3"></i>
                        <h3 class="font-bold text-slate-200">Catalogo Esplosi & Componenti</h3>
                        <p class="text-xs text-slate-400 mt-1">Seleziona la macchina per visualizzare lo spaccato tecnico con codici ricambio originali.</p>
                        <button class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">Carica Esploso Grafico</button>
                    </div>
                `;
            } else if (section === 'service') {
                bodyEl.innerHTML = `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                        <h3 class="font-bold text-sm text-slate-200"><i class="fa-solid fa-sliders text-rose-400 mr-2"></i> Parametri Service Avanzati</h3>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between p-2 bg-slate-900 rounded border border-slate-700">
                                <span>[Mode 2-20] Limitazione Corrente Assorbita</span>
                                <span class="text-rose-400 font-mono">Standard (16A)</span>
                            </div>
                            <div class="flex justify-between p-2 bg-slate-900 rounded border border-slate-700">
                                <span>[Mode 2-24] Controllo Sensore Umidità</span>
                                <span class="text-rose-400 font-mono">Abilitato</span>
                            </div>
                            <div class="flex justify-between p-2 bg-slate-900 rounded border border-slate-700">
                                <span>[Mode 2-41] Pompa Scarico Condensa</span>
                                <span class="text-rose-400 font-mono">Opzionale / Off</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                bodyEl.innerHTML = `
                    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center">
                        <i class="fa-solid fa-folder-open text-4xl text-blue-400 mb-3"></i>
                        <h3 class="font-bold text-slate-200">Sezione ${section.toUpperCase()}</h3>
                        <p class="text-xs text-slate-400 mt-1">Contenuti tecnici completi divisi per unità interna, unità esterna e serie storiche.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
